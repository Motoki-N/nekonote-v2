# 最小CI: 型チェックとリント（CLAUDE.md の検証コマンドと同一）。
# 外部PRを受けるため pull_request_target は使わない（フォークのコードを
# シークレット付きで実行しないため）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
